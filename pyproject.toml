[project]
name = "arduedit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygments>=2.21.0",
    "pyserial>=3.5",
    "pyside6>=6.12.0",
    "pyside6-addons>=6.12.0",
    "pyyaml>=6.0.3",
]

# --- Entry point GUI (importante per PyInstaller/Nuitka) ---
[project.gui-scripts]
arduedit = "arduedit.__main__:main"


# --- Dipendenze solo per lo sviluppo e il packaging ---
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.0",
    # "nuitka>=2.0",  # opzionale, se preferisci Nuitka
]

# --- Configurazione del build backend (uv_build è il default moderno) ---
[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
